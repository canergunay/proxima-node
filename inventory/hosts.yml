all:
  children:
    vpn_exit:
      hosts:
        erg-tr:
          ansible_host: 10.12.12.101
          public_host: 82.26.94.37
          mgmt_tunnel_host: 10.12.12.101
          server_location: TR
        # ansible_host stays PUBLIC here on purpose — do not "finish" the
        # migration by pointing it at mgmt_tunnel_host. Measured 2026-08-13:
        # this node's wg-adm interface is up and its systemd unit active, its
        # public key matches the peer ERG holds, and ERG has still seen no
        # handshake for 6.5 days; 10.12.12.102:22 is unreachable while
        # 46.224.49.250:22 answers. The tunnel is dead at the network layer,
        # not misconfigured — UDP between Russia and Hetzner is restricted and
        # there is nothing on our side to fix. Switching this line would cut
        # Ansible off from the only path that works.
        erg-de:
          ansible_host: 46.224.49.250
          public_host: 46.224.49.250
          mgmt_tunnel_host: 10.12.12.102
          server_location: DE
          server_provider: Hetzner
        erg-fi:
          ansible_host: 10.12.12.103
          public_host: 109.120.187.205
          mgmt_tunnel_host: 10.12.12.103
          server_location: FI
        erg-pl:
          ansible_host: 10.12.12.100
          public_host: 193.200.16.140
          mgmt_tunnel_host: 10.12.12.100
          ansible_port: 56777
          server_location: PL
          server_provider: BlueVPS
        # Held in reserve, not in any pool. Its tunnel was last seen 2 days
        # before 2026-08-13, so expect the first Ansible run against it to
        # fail on the tunnel address and check the handshake before blaming
        # the playbook.
        erg-tr-fast:
          ansible_host: 10.12.12.104
          public_host: 185.229.12.109
          mgmt_tunnel_host: 10.12.12.104
          server_location: TR
          server_provider: vps.com.tr
    dpi_bypass:
      hosts:
        erg-ru:
          ansible_host: 192.168.2.92
          public_host: 192.168.2.92
          server_location: RU-LAN
          server_provider: local-pi5
    proxima_sites:
      hosts:
        svr:
          ansible_host: 10.12.12.10
          # The bench address from when the box sat on ERG's LAN. It left on
          # 2026-08-13 and is in transit to the site, so this value is stale
          # until it is racked and its WAN address is known. ansible_host is
          # the tunnel, so nothing depends on this line meanwhile.
          public_host: 192.168.2.96
          mgmt_tunnel_host: 10.12.12.10
          ansible_user: root
          server_code: SVR
  vars:
    ansible_user: root
    ansible_python_interpreter: /usr/bin/python3
