---
# Update proxima-agent on all servers
# Deploys the latest agent.py, service unit and firewall rules, then restarts.
# config.json is deliberately NOT touched — see roles/proxima-agent/tasks/deploy.yml.
#
# Usage:
#   ansible-playbook playbooks/update-agent.yml              # all nodes
#   ansible-playbook playbooks/update-agent.yml -l erg-pl    # single server

# Node groups only. This deploys and restarts proxima-agent, which site servers
# (proxima_sites) do not run — including them would install an agent on a live
# site nobody asked for one on.
- name: Update proxima-agent
  hosts: vpn_exit:dpi_bypass
  gather_facts: false

  tasks:
    - name: Deploy agent code, service and firewall rules
      ansible.builtin.include_role:
        name: proxima-agent
        tasks_from: deploy.yml

    - name: Apply pending restarts before health checking
      ansible.builtin.meta: flush_handlers

    - name: Wait for agent to come up
      ansible.builtin.uri:
        url: "https://{{ ansible_host }}:{{ agent_port | default(5051) }}/health"
        validate_certs: false
        status_code: 200
      register: health_check
      retries: 5
      delay: 3
      until: health_check.status == 200
      delegate_to: localhost

    - name: Report agent status
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }}: agent healthy on {{ ansible_host }}:{{ agent_port | default(5051) }}"
