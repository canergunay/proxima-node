---
# Management rides an outbound AmneziaWG tunnel to ADM rather than an inbound
# port on the node's public address.
#
# Two failures drove the tunnel itself. A stalled scanner on the public agent
# port froze the agent for 19 hours (ERG-FI, July). Then ERG-PL's public
# address stopped answering from Russia entirely while the box was healthy —
# 28 days of uptime, every service running, and ADM reporting it offline for
# 14 hours, because the only path ADM had was the one that broke.
#
# It is AmneziaWG rather than plain WireGuard because the transports on these
# nodes have been disappearing one at a time. TCP went first: Shadowsocks and
# the agent port on two nodes died within a day of each other while the
# obfuscated AWG data plane to the same addresses carried traffic untouched.
# A management path built on a protocol DPI recognises is a path waiting to
# be taken away.
#
# The implementation is userspace on purpose. amneziawg-go is a single static
# binary; the kernel module needs a DKMS build on every node and is already
# on the productization fragility list. Management traffic is a few KB per
# poll, so the performance difference does not exist here.

- name: Install WireGuard tools (awg-quick's dependencies)
  ansible.builtin.apt:
    name: wireguard-tools
    state: present
    update_cache: true

- name: Install the AmneziaWG userspace binaries
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    owner: root
    group: root
    mode: "0755"
  loop:
    - { src: "awg", dest: "/usr/bin/awg" }
    - { src: "awg-quick", dest: "/usr/bin/awg-quick" }
    - { src: "amneziawg-go", dest: "/usr/bin/amneziawg-go" }
  notify: Restart management tunnel

- name: Create the AmneziaWG configuration directory
  ansible.builtin.file:
    path: /etc/amnezia/amneziawg
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Write the management tunnel configuration
  ansible.builtin.copy:
    content: "{{ mgmt_tunnel_conf_b64 | b64decode }}"
    dest: "/etc/amnezia/amneziawg/{{ mgmt_tunnel_interface }}.conf"
    owner: root
    group: root
    mode: "0600"
  notify: Restart management tunnel

# awg-quick@ resolves the userspace implementation from the environment, and
# there is no kernel module to fall back to, so the unit has to carry it.
- name: Point awg-quick at the userspace implementation
  ansible.builtin.copy:
    content: |
      # Managed by Ansible — roles/mgmt-tunnel.
      # No amneziawg kernel module is installed; without this awg-quick tries
      # to create a kernel interface and fails with "operation not supported".
      [Service]
      Environment=WG_QUICK_USERSPACE_IMPLEMENTATION=amneziawg-go
    dest: "/etc/systemd/system/awg-quick@{{ mgmt_tunnel_interface }}.service.d/userspace.conf"
    owner: root
    group: root
    mode: "0644"
  notify: Restart management tunnel

- name: Enable and start the management tunnel
  ansible.builtin.systemd:
    name: "awg-quick@{{ mgmt_tunnel_interface }}"
    enabled: true
    state: started
    daemon_reload: true

- name: Check whether this host uses ufw
  ansible.builtin.command: ufw status
  register: mgmt_tunnel_ufw
  changed_when: false
  failed_when: false

# Not every node runs ufw — erg-tr and erg-ru are filtered by the
# PROXIMA_AGENT iptables chain that roles/proxima-agent installs, and that
# template carries the same two ranges. Running the ufw module on a host
# without ufw would fail the play for no reason.
- name: Allow the agent port from the management and admin networks
  community.general.ufw:
    rule: allow
    port: "{{ agent_port | default(5051) }}"
    proto: tcp
    from_ip: "{{ item }}"
    comment: "proxima-agent over the management tunnel"
  loop:
    - "{{ mgmt_tunnel_subnet | default('10.12.12.0/24') }}"
    - "{{ mgmt_tunnel_admin_subnet | default('10.13.13.0/24') }}"
  when: "'Status: active' in (mgmt_tunnel_ufw.stdout | default(''))"

# ── Withdrawing the public agent port ────────────────────────────────────
#
# Only once the tunnel has actually carried a handshake. roles/common adds
# the public allows earlier in the same play, so the ordering gives the right
# failure mode for free: a tunnel that comes up closes the public port, and a
# tunnel that does not leaves it open and the node still manageable. Closing
# it on faith is how a node becomes reachable only through its provider's
# console.

- name: Wait for the tunnel to complete a handshake
  ansible.builtin.shell: >-
    awg show {{ mgmt_tunnel_interface }} latest-handshakes
    | awk '$2 > 0 {found=1} END {exit !found}'
  register: mgmt_tunnel_handshake
  changed_when: false
  failed_when: false
  retries: 6
  delay: 5
  until: mgmt_tunnel_handshake.rc == 0

- name: Report that the public agent port is being kept
  ansible.builtin.debug:
    msg: >-
      No handshake on {{ mgmt_tunnel_interface }} yet — leaving the public
      agent port open so this node stays reachable.
  when: mgmt_tunnel_handshake.rc != 0

- name: Withdraw the public agent port now the tunnel carries traffic
  community.general.ufw:
    rule: allow
    port: "{{ agent_port | default(5051) }}"
    proto: tcp
    from_ip: "{{ item }}"
    delete: true
  loop: "{{ proxima_ips | default([]) }}"
  when:
    - mgmt_tunnel_close_public | default(true) | bool
    - mgmt_tunnel_handshake.rc == 0
    - "'Status: active' in (mgmt_tunnel_ufw.stdout | default(''))"
