---
# Management rides an outbound WireGuard tunnel to ADM rather than an inbound
# port on the node's public address.
#
# Two failures drove this. A stalled scanner on the public agent port froze
# the agent for 19 hours (ERG-FI, July). Then ERG-PL's public address stopped
# answering from Russia entirely while the box itself was healthy — 28 days of
# uptime, every service running, and ADM reporting it offline for 14 hours,
# because the only path ADM had was the one that broke.
#
# A tunnel the node dials out on needs no port forward, no inbound rule, and
# no reachable public address. It also gives "the agent is unreachable" a
# meaning it did not have before: the tunnel is down, rather than something
# unknown about the network in between.

- name: Install WireGuard
  ansible.builtin.apt:
    name: wireguard-tools
    state: present
    update_cache: true

- name: Write the management tunnel configuration
  ansible.builtin.copy:
    content: "{{ mgmt_tunnel_conf_b64 | b64decode }}"
    dest: "/etc/wireguard/{{ mgmt_tunnel_interface }}.conf"
    owner: root
    group: root
    mode: "0600"
  notify: Restart management tunnel

- name: Enable and start the management tunnel
  ansible.builtin.systemd:
    name: "wg-quick@{{ mgmt_tunnel_interface }}"
    enabled: true
    state: started
    daemon_reload: true

# Reaching the agent over the tunnel is the point, so the rule has to exist
# before the public one can be withdrawn. The public allow is left in place
# here on purpose — see the note in roles/common/tasks/ufw.yml.
#
# Both ranges, not just the management one: ADM polls from 10.12.12.1, but an
# admin debugging a node comes from wg-easy's 10.13.13.0/24. The client config
# already routes both, so allowing only the first produces a tunnel that ADM
# can use and a human cannot — which is how this was first deployed, and it
# took a confused round trip to notice.
- name: Allow the agent port from the management and admin networks
  community.general.ufw:
    rule: allow
    port: "{{ agent_port | default(5051) }}"
    proto: tcp
    from_ip: "{{ item }}"
    comment: "proxima-agent over the management tunnel"
  loop:
    - "{{ mgmt_tunnel_subnet | default('10.12.12.0/24') }}"
    - "{{ mgmt_tunnel_admin_subnet | default('10.13.13.0/24') }}"

# ── Withdrawing the public agent port ────────────────────────────────────
#
# Only once the tunnel has actually carried a handshake. roles/common adds
# the public allows earlier in the same play, so the ordering gives the right
# failure mode for free: a tunnel that comes up closes the public port, and a
# tunnel that does not leaves it open and the node still manageable. Closing
# it on faith is how a node becomes reachable only through its provider's
# console.

- name: Wait for the tunnel to complete a handshake
  ansible.builtin.shell: >-
    wg show {{ mgmt_tunnel_interface }} latest-handshakes
    | awk '$2 > 0 {found=1} END {exit !found}'
  register: mgmt_tunnel_handshake
  changed_when: false
  failed_when: false
  retries: 6
  delay: 5
  until: mgmt_tunnel_handshake.rc == 0

- name: Report that the public agent port is being kept
  ansible.builtin.debug:
    msg: >-
      No handshake on {{ mgmt_tunnel_interface }} yet — leaving the public
      agent port open so this node stays reachable.
  when: mgmt_tunnel_handshake.rc != 0

- name: Withdraw the public agent port now the tunnel carries traffic
  community.general.ufw:
    rule: allow
    port: "{{ agent_port | default(5051) }}"
    proto: tcp
    from_ip: "{{ item }}"
    delete: true
  loop: "{{ proxima_ips | default([]) }}"
  when:
    - mgmt_tunnel_close_public | default(true) | bool
    - mgmt_tunnel_handshake.rc == 0
