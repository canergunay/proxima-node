---
# The management tunnel the node dials out on. ADM generates the config and
# passes it base64-encoded; without it the role does nothing, so a play that
# does not supply one leaves the node exactly as it was.
mgmt_tunnel_interface: wg-adm
mgmt_tunnel_conf_b64: ""
# ADM polls from the first; humans debugging a node arrive from the second,
# which is wg-easy's range. Both are routed by the client config.
mgmt_tunnel_subnet: 10.12.12.0/24
mgmt_tunnel_admin_subnet: 10.13.13.0/24

# Close the internet-facing agent port once the tunnel is carrying traffic.
# A stalled scanner on that port froze an agent for 19 hours in July; a port
# that is not reachable cannot be scanned. Set false to keep both paths.
mgmt_tunnel_close_public: true
# ADM's own end of the tunnel. The role pings it to decide whether the tunnel
# actually carries traffic before withdrawing the public agent port.
mgmt_tunnel_gateway: 10.12.12.1
