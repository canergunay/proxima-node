---
- name: Install UFW
  ansible.builtin.apt:
    name: ufw
    state: present

- name: Set UFW default deny incoming
  community.general.ufw:
    direction: incoming
    default: deny

- name: Set UFW default allow outgoing
  community.general.ufw:
    direction: outgoing
    default: allow

- name: Allow SSH
  community.general.ufw:
    rule: allow
    port: "{{ ssh_port | default(22) }}"
    proto: tcp
    comment: SSH

- name: Allow SS port (TCP)
  community.general.ufw:
    rule: allow
    port: "{{ ss_port | default(8388) }}"
    proto: tcp
    comment: Shadowsocks TCP

- name: Allow SS port (UDP)
  community.general.ufw:
    rule: allow
    port: "{{ ss_port | default(8388) }}"
    proto: udp
    comment: Shadowsocks UDP

- name: Allow agent port from Proxima IPs only
  community.general.ufw:
    rule: allow
    port: "{{ agent_port | default(5051) }}"
    proto: tcp
    from_ip: "{{ item }}"
    comment: "Proxima agent from {{ item }}"
  loop: "{{ proxima_ips | default([]) }}"
  when: proxima_ips | default([]) | length > 0

# scripts/01-harden.sh used to open 3000/tcp unconditionally for an AdGuard
# Home setup wizard that nothing installs any more. Removing the line only
# helps new nodes, so delete the rule here too and let a re-run converge the
# ones that already carry it.
- name: Remove stale AdGuard web port rule
  community.general.ufw:
    rule: allow
    port: "3000"
    proto: tcp
    delete: true

- name: Enable UFW
  community.general.ufw:
    state: enabled
