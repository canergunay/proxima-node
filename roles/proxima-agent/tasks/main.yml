---
- name: Install Python dependencies
  ansible.builtin.apt:
    name:
      - python3
      - python3-pip
      - python3-venv
      - python3-setuptools
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Create agent directory
  ansible.builtin.file:
    path: "{{ agent_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Write agent config
  ansible.builtin.template:
    src: config.json.j2
    dest: "{{ agent_dir }}/config.json"
    owner: root
    group: root
    mode: "0600"
  notify: restart proxima-agent

# Code, service unit and firewall rules — also used on its own by
# playbooks/update-agent.yml, which must not rewrite config.json.
- name: Deploy agent code, service and firewall rules
  ansible.builtin.include_tasks: deploy.yml
