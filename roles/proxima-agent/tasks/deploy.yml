---
# Agent code, service unit and firewall rules.
#
# Shared by the initial install (main.yml) and playbooks/update-agent.yml so the
# two paths cannot drift apart. Nothing here touches config.json — an agent
# update must never rotate the API key out from under ADM.

- name: Create Python venv
  ansible.builtin.command:
    cmd: python3 -m venv {{ agent_dir }}/venv
    creates: "{{ agent_dir }}/venv/bin/python"

- name: Deploy agent script
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../agent/agent.py"
    dest: "{{ agent_dir }}/agent.py"
    owner: root
    group: root
    mode: "0644"
  notify: restart proxima-agent

- name: Deploy requirements.txt
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../agent/requirements.txt"
    dest: "{{ agent_dir }}/requirements.txt"
    owner: root
    group: root
    mode: "0644"

- name: Install requirements in venv
  ansible.builtin.pip:
    requirements: "{{ agent_dir }}/requirements.txt"
    virtualenv: "{{ agent_dir }}/venv"
  notify: restart proxima-agent

- name: Deploy proxima-agent systemd service
  ansible.builtin.template:
    src: proxima-agent.service.j2
    dest: /etc/systemd/system/proxima-agent.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - daemon reload
    - restart proxima-agent

# ── Firewall ───────────────────────────────────────────────────────────────
# The management API must only be reachable from the Proxima instances that
# poll it. Leaving it open to the internet is what let a random scanner wedge
# the agent on ERG-FI. Not every node runs ufw, so handle both cases — an
# unrestricted port must never pass silently again.

- name: Fail early if the agent port cannot be restricted
  ansible.builtin.assert:
    that: proxima_ips | default([]) | length > 0
    fail_msg: >-
      proxima_ips is empty, so the agent port would stay open to the internet.
      Set it in inventory/group_vars/all.yml before deploying.

# shell, not command: `command -v` is a shell builtin and always fails under
# the command module, which would silently push every host down the fallback path.
- name: Check whether ufw is available
  ansible.builtin.shell: command -v ufw
  register: ufw_bin
  changed_when: false
  failed_when: false

- name: Allow agent port from Proxima instances only (ufw)
  ansible.builtin.command:
    cmd: "ufw allow from {{ item }} to any port {{ agent_port }} proto tcp comment 'proxima-agent'"
  loop: "{{ proxima_ips }}"
  register: ufw_allow
  changed_when: "'Rule added' in ufw_allow.stdout or 'Rules updated' in ufw_allow.stdout"
  when: ufw_bin.rc == 0

# Runs after the restricted rules above, so there is never a window without access.
- name: Remove world-open agent port rule (ufw)
  ansible.builtin.command:
    cmd: "ufw --force delete allow {{ agent_port }}/tcp"
  register: ufw_delete
  changed_when: "'Deleting' in ufw_delete.stdout or 'Rule deleted' in ufw_delete.stdout"
  failed_when: false
  when: ufw_bin.rc == 0

- name: Deploy agent firewall script (hosts without ufw)
  ansible.builtin.template:
    src: proxima-agent-firewall.sh.j2
    dest: /usr/local/sbin/proxima-agent-firewall.sh
    owner: root
    group: root
    mode: "0755"
  when: ufw_bin.rc != 0
  notify: reapply agent firewall

- name: Deploy agent firewall unit (hosts without ufw)
  ansible.builtin.template:
    src: proxima-agent-firewall.service.j2
    dest: /etc/systemd/system/proxima-agent-firewall.service
    owner: root
    group: root
    mode: "0644"
  when: ufw_bin.rc != 0
  notify:
    - daemon reload
    - reapply agent firewall

- name: Enable agent firewall unit (hosts without ufw)
  ansible.builtin.systemd:
    name: proxima-agent-firewall
    enabled: true
    state: started
    daemon_reload: true
  when: ufw_bin.rc != 0

# Keep exactly one owner of the rule. A host that gained ufw — or that got the
# fallback by mistake — must not end up with two mechanisms guarding the port.
- name: Remove fallback unit and script where ufw owns the port
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/systemd/system/proxima-agent-firewall.service
    - /usr/local/sbin/proxima-agent-firewall.sh
  when: ufw_bin.rc == 0
  notify: daemon reload

- name: Check for a leftover fallback iptables chain
  ansible.builtin.command: iptables -L PROXIMA_AGENT -n
  register: fallback_chain
  changed_when: false
  failed_when: false
  when: ufw_bin.rc == 0

- name: Remove leftover fallback iptables chain
  ansible.builtin.shell: |
    set -e
    while iptables -C INPUT -p tcp --dport {{ agent_port }} -j PROXIMA_AGENT 2>/dev/null; do
        iptables -D INPUT -p tcp --dport {{ agent_port }} -j PROXIMA_AGENT
    done
    iptables -F PROXIMA_AGENT
    iptables -X PROXIMA_AGENT
  when: ufw_bin.rc == 0 and fallback_chain.rc == 0

- name: Enable and start proxima-agent
  ansible.builtin.systemd:
    name: proxima-agent
    enabled: true
    state: started
    daemon_reload: true
